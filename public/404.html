<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Amine Benzerga — Cloud Engineer</title>
    <!--
      GitHub Pages SPA fallback (rafgraph/spa-github-pages).
      Redirects deep links (e.g. /portfolio/projects/batinnov) to index.html,
      which decodes the path back. pathSegmentsToKeep = 1 keeps the "/portfolio" base.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
