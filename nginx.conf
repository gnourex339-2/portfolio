# Minimal Nginx config for the static SPA (served behind Cloudflare in production).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip (Cloudflare also compresses, but this covers direct hits)
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml application/font-woff2 font/woff2;

    # Security headers (brief §10)
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # HSTS is set at the Cloudflare edge; uncomment if serving TLS directly:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Long-cache fingerprinted assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — let React Router handle client routes (/projects/:slug)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
